<meta name="description" content="Book Navratri 2026 garba passes. Instant booking on WhatsApp.">
<style>
:root{--bg:#2b0012;--card:#3b0a1f;--ink:#f7e8c8;--mut:#cdb58c;--pink:#e3b75f;--gold:#e3b75f;--line:#6a3a33;--green:#1faa59}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
.hero{padding:calc(26px + env(safe-area-inset-top)) 20px 28px;text-align:center;border-bottom:1px solid var(--line);background:radial-gradient(circle at 50% 0,#5a0f2e,transparent 70%)}
.logo{width:min(62vw,230px);height:auto;border-radius:50%;box-shadow:0 0 0 2px #e3b75f55,0 8px 30px #0008}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.6rem,7vw,2.5rem);line-height:1.15;margin-top:14px;color:#f0cf7f;letter-spacing:.5px}
.hero p{margin:8px auto 0;max-width:420px;color:var(--mut)}
.call{display:inline-block;margin-top:16px;padding:11px 22px;border-radius:30px;border:1.5px solid var(--gold);color:var(--gold);font-weight:700;text-decoration:none}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line)}
.bar input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
.bar input::placeholder{color:var(--mut)}
.chips{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font-weight:600;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--gold);color:#2b0012}
main{max-width:1000px;margin:0 auto;padding:16px 14px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.img{height:140px;position:relative;display:flex;align-items:flex-end;padding:12px;color:#f7dd9b;font-family:Georgia,serif;font-size:1.35rem;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.5);border-bottom:2px solid var(--gold)}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img span{position:relative}
.tag{position:absolute;top:10px;right:10px;background:var(--gold);color:#2b0012;font:700 .75rem system-ui;padding:4px 9px;border-radius:12px}
.body{padding:14px;display:flex;flex-direction:column;gap:7px;flex:1}
.info{font-size:.9rem;color:var(--mut);line-height:1.45}
.tiers{display:grid;gap:7px;margin-top:4px}
.tier{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:.95rem}
.tier input{margin-right:8px;accent-color:var(--gold)}
.tier b{color:#f0cf7f}
.tier.sel{border-color:var(--gold);background:#e3b75f1a}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.total{font-size:1.5rem;font-weight:800;color:#f0cf7f}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font-size:1.3rem;cursor:pointer}
.qty span{min-width:20px;text-align:center;font-weight:700}
.date{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#2b0012;color:var(--ink);font-size:.95rem}
.buy{margin-top:6px;padding:14px;border:0;border-radius:12px;background:linear-gradient(180deg,#f3d58a,#d4a23f);color:#2b0012;font-size:1.05rem;font-weight:800;cursor:pointer}
.buy[disabled]{background:#5a3a42;color:#bba;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.none{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;background:var(--green);color:#fff;text-decoration:none;font-weight:700;padding:14px 18px;border-radius:30px;box-shadow:0 4px 16px #0006}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:10px 20px}
</style>
</head>

  <h1>Navratri 2026 Garba Passes</h1>
  <p>Ahmedabad's top garba grounds, 10–20 Oct. Choose your pass and book instantly on WhatsApp.</p>
  <a class="call" href="tel:+918849101387">Call 88491 01387</a>
</section>

<div class="bar">
  <input id="q" type="search" placeholder="Search garba, artist or place" aria-label="Search">
  <div class="chips" id="chips"></div>
</div>
<main id="list"></main>
<footer>Elite Garba Club (EGC) · Prices per pass. Final availability is confirmed on WhatsApp.</footer>
<a class="fab" id="fab" target="_blank" rel="noopener">WhatsApp us</a>

<script>
/* ================= EDIT ONLY THIS PART ================= */
const WA = "918849101387";   // country code + number, no + or spaces
const SHEET_URL = "";   // paste your Google Sheet "Publish to web" CSV link here (optional)
const ADD = 0;               // optional: amount added to every price (your margin)

/* name, artist, place, dates, img (photo link or "images/x.jpg", optional),
   tiers: [label, price] — empty tiers + soldOut:true = sold out, ac:true = AC Dome */
let EVENTS = [
 {n:"Safed Parindey",d:"16 Oct 2026",t:[["Pass",6700]]},
 {n:"Swarnim Nagari AC Dome",a:"Aishwarya Majmudar",p:"Swarnim Nagari Ground",d:"11–20 Oct",ac:1,
  t:[["Gold (11–15 Oct)",880],["Platinum (11–15 Oct)",1200],["Gold (16–20 Oct)",980],["Platinum (16–20 Oct)",1250]]},
 {n:"Sachi Navratri AC Dome",a:"Jigardan Gadhavi",p:"Sachi Navratri Ground, New Science City Road",d:"10–19 Oct 2026",ac:1,
  t:[["Rajat (10–15 Oct)",960],["Suvarna (10–15 Oct)",1150],["Rajat (16–19 Oct)",1050],["Suvarna (16–19 Oct)",1350]]},
 {n:"Parampara Navratri AC Dome",a:"Kirtidan Gadhavi",d:"10–19 Oct 2026",ac:1,t:[["Diamond",1200]]},
 {n:"Efesto",a:"Bhumik Shah",p:"Neem Bagan, Rancharda",d:"12 Oct 2026",t:[["Pass",3900]]},
 {n:"Garbi Na Garba",d:"11–19 Oct 2026",t:[["Pass",1000]]},
 {n:"Vanratri",d:"11–20 Oct 2026",t:[["Pass",1500]]},
 {n:"Shankus Sheri Circle",a:"Ishani Dave",d:"11–19 Oct 2026",t:[["Pass (same price all days)",550]]},
 {n:"Maniyaro",d:"11–19 Oct 2026",t:[["Pass",950]]},
 {n:"Mandalam Garba",p:"Mandalam Garba Ground",d:"11–20 Oct",t:[["With food",850],["Without food",650]]},
 {n:"Maavdee Navratri",p:"R.M. Patel Farm",d:"11–19 Oct 2026",t:[["Pass",900]]},
 {n:"Raatladi",d:"11–19 Oct 2026",t:[],soldOut:1},
 {n:"Tatva Experience",p:"Monkey Forest",d:"11–19 Oct 2026",t:[["Pass",1200]]},
 {n:"Divi Garba",p:"Master Farm",d:"12–20 Oct 2026",t:[],soldOut:1},
 {n:"Ruda Garba",d:"11–20 Oct 2026",t:[["Pass",800]]},
 {n:"Saibo",p:"Mahendra Farm",d:"11–19 Oct 2026",t:[["11–14 Oct",900],["15–19 Oct",1150],["17 Oct",1300]]},
 {n:"Mandvo",p:"Vishv Umiya Foundation",d:"11–19 Oct 2026",t:[["Gold",450],["Fanpit",750]]}
];
/* ======================================================== */

const $=s=>document.querySelector(s), inr=n=>"₹"+n.toLocaleString("en-IN");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state=EVENTS.map(()=>({t:0,q:1}));
let filter="all";
$("#fab").href="https://wa.me/"+WA+"?text="+encodeURIComponent("Hi Elite Garba Club, I want to book garba passes for Navratri 2026.");

[["all","All"],["avail","Available"],["ac","AC Dome"],["farm","Under ₹1,000"]].forEach(([k,l])=>{
  const b=document.createElement("button");b.className="chip"+(k==="all"?" on":"");b.textContent=l;
  b.onclick=()=>{filter=k;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));draw()};
  $("#chips").append(b);
});
$("#q").oninput=draw;

function minPrice(e){return e.t.length?Math.min(...e.t.map(x=>x[1]))+ADD:0}
function match(e){
  const q=$("#q").value.trim().toLowerCase();
  if(q&&![e.n,e.a,e.p].join(" ").toLowerCase().includes(q))return false;
  if(filter==="avail")return !e.soldOut;
  if(filter==="ac")return !!e.ac;
  if(filter==="farm")return !e.soldOut&&minPrice(e)<1000;
  return true;
}
function draw(){
  const html=EVENTS.map((e,i)=>match(e)?card(e,i):"").join("");
  $("#list").innerHTML=html||'<p class="none">No garba found. Try another search.</p>';
}
function card(e,i){
  const s=state[i],hue=(i*47)%360;
  const img=e.img?`<img src="${esc(e.img)}" alt="" loading="lazy" onerror="this.remove()">`:"";
  const tiers=e.t.map((t,k)=>`<label class="tier ${k===s.t?"sel":""}"><span><input type="radio" name="t${i}" ${k===s.t?"checked":""} onchange="pick(${i},${k})">${esc(t[0])}</span><b>${inr(t[1]+ADD)}</b></label>`).join("");
  return `<article class="card" id="c${i}">
   <div class="img" style="background:linear-gradient(135deg,hsl(${340+hue%30},70%,${14+hue%8}%),hsl(${350+hue%25},75%,24%))">${img}<span>${esc(e.n)}</span>${e.ac?'<div class="tag">AC Dome</div>':""}</div>
   <div class="body">
    <div class="info">${e.a?`🎤 ${esc(e.a)}<br>`:""}${e.p?`📍 ${esc(e.p)} · <a href="https://maps.google.com/?q=${encodeURIComponent(e.p+" Ahmedabad")}" target="_blank" rel="noopener" style="color:var(--pink);font-weight:600">Map</a><br>`:""}🗓️ ${esc(e.d)}</div>
    ${e.soldOut?'<button class="buy" disabled>Sold out</button>':`
    <div class="tiers">${tiers}</div>
    <input class="date" id="dt${i}" placeholder="Your preferred date (e.g. 14 Oct)" aria-label="Preferred date">
    <div class="row"><div class="total" id="tot${i}">${inr((e.t[s.t][1]+ADD)*s.q)}</div>
     <div class="qty"><button onclick="chg(${i},-1)" aria-label="Fewer">−</button><span id="q${i}">${s.q}</span><button onclick="chg(${i},1)" aria-label="More">+</button></div></div>
    <button class="buy" onclick="buy(${i})">Book on WhatsApp</button>`}
   </div></article>`;
}
function pick(i,k){state[i].t=k;upd(i);document.querySelectorAll("#c"+i+" .tier").forEach((el,j)=>el.classList.toggle("sel",j===k))}
function chg(i,d){state[i].q=Math.min(30,Math.max(1,state[i].q+d));upd(i)}
function upd(i){const s=state[i];$("#q"+i).textContent=s.q;$("#tot"+i).textContent=inr((EVENTS[i].t[s.t][1]+ADD)*s.q)}
function buy(i){
  const e=EVENTS[i],s=state[i],t=e.t[s.t],date=($("#dt"+i).value||"").trim();
  const msg=`Hi Elite Garba Club, I want to book garba passes.\n\nGarba: ${e.n}\nPass: ${t[0]}\nQuantity: ${s.q}\nRate: ${inr(t[1]+ADD)} each\nTotal: ${inr((t[1]+ADD)*s.q)}\nDate: ${date||"please confirm"}\n`+(e.p?`Location: ${e.p}\n`:"");
  window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
}
function parseCSV(t){const r=[];let w=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){w.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;w.push(c);r.push(w);w=[];c=""}else c+=ch}if(c||w.length){w.push(c);r.push(w)}return r}
async function loadSheet(){
  if(!SHEET_URL)return;
  try{
    const res=await fetch(SHEET_URL+(SHEET_URL.includes("?")?"&":"?")+"t="+Date.now());
    const rows=parseCSV(await res.text()),H=rows.shift().map(x=>x.trim().toLowerCase());
    const g=(r,k)=>(r[H.indexOf(k)]||"").trim(),yes=v=>/^(yes|y|1|true)$/i.test(v);
    const ev=rows.filter(r=>g(r,"name")&&g(r,"show").toLowerCase()!=="no").map(r=>{
      const t=g(r,"tiers").split(";").map(s=>s.split("=")).filter(x=>x.length==2&&+x[1]>0).map(x=>[x[0].trim(),+x[1]]);
      return {n:g(r,"name"),a:g(r,"artist"),p:g(r,"place"),d:g(r,"dates"),img:g(r,"image"),ac:yes(g(r,"ac")),soldOut:yes(g(r,"soldout"))||!t.length,t};
    });
    if(ev.length){EVENTS=ev;state=EVENTS.map(()=>({t:0,q:1}));draw()}
  }catch(e){}
}
draw();
loadSheet();
</script>
